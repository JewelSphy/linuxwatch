[thresholds]
cpu_warning = 80
cpu_critical = 95
ram_warning = 85
disk_warning = 90

[monitor]
interval = 60
services = sshd, cron, nginx

[paths]
database = linuxwatch.db
log_file = linuxwatch.log
server_database = server.db
agent_buffer = buffer.jsonl

[alerts]
duration = 300
cooldown = 1800

[discord]
webhook_url =

[agent]
server_url = http://localhost:8000
api_key = REPLACE_WITH_KEY_1

[api_keys]
REPLACE_WITH_KEY_1 = linux-monitor
REPLACE_WITH_KEY_2 = web-01

[storage]
raw_days = 7
hourly_days = 90
cleanup_every = 3600

[detect]
window = 30
z_limit = 3
min_jump = 10
forecast_days = 7
